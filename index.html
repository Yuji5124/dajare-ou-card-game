<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダジャレ王</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section id="titleScreen" class="screen active">
      <div class="brand">
        <p class="kicker">スマホカードバトル</p>
        <h1>ダジャレ王</h1>
        <p>ゆるいダジャレで、おもしろP勝負。</p>
      </div>
      <button id="startBtn" class="primary">ひとりで遊ぶ</button>
      <button id="onlineBtn" class="primary">オンライン対戦</button>
      <button id="resetBtn" class="ghost">セーブをリセット</button>
    </section>

    <section id="roomScreen" class="screen">
      <header><h2>オンライン対戦</h2></header>
      <form id="roomForm" class="pass-form">
        <label for="roomPassword">パスワード</label>
        <input id="roomPassword" type="text" autocomplete="off" placeholder="同じ言葉で同じルーム">
        <div class="toolbar">
          <button id="createRoomBtn" class="primary" type="button">ルームを作る</button>
          <button id="joinRoomBtn" class="primary" type="button">参加する</button>
        </div>
        <p id="roomStatus" class="pass-error" aria-live="polite"></p>
      </form>
      <button id="roomBackBtn" class="back ghost" data-to="titleScreen" type="button">もどる</button>
    </section>

    <section id="onlineBattleScreen" class="screen">
      <header class="scorebar">
        <div class="score-side">
          <span>自分</span>
          <strong id="onlineMyScore">0</strong><small>/5P</small>
          <div id="onlineMyPips" class="score-pips"></div>
        </div>
        <div class="score-side">
          <span>相手</span>
          <strong id="onlineOpponentScore">0</strong><small>/5P</small>
          <div id="onlineOpponentPips" class="score-pips"></div>
        </div>
      </header>
      <div id="onlineLog" class="log">相手を待っています。</div>
      <div class="battle-status">
        <div id="onlineSelectedStatus" class="status-chip">
          <span>選択中カード</span>
          <strong id="onlineSelectedCardName">なし</strong>
        </div>
        <div id="onlineOpponentStatus" class="status-chip">
          <span>相手</span>
          <strong id="onlineOpponentReady">未選択</strong>
        </div>
      </div>
      <div id="onlineSelectedPreview" class="selected-preview">
        <span>選んだカードがここに出ます</span>
      </div>
      <h3>手札</h3>
      <div id="onlineHand" class="hand"></div>
      <button id="roomResetBtn" class="ghost" type="button">ルームリセット</button>
    </section>

    <section id="enemyScreen" class="screen">
      <header><h2>敵をえらぶ</h2></header>
      <div id="enemyList" class="enemy-list"></div>
      <button class="back ghost" data-to="titleScreen">もどる</button>
    </section>

    <section id="deckScreen" class="screen">
      <header>
        <h2>デッキ構成</h2>
        <p id="deckCount">0 / 30</p>
      </header>
      <p id="deckHelp" class="deck-help">おすすめ編成で30枚にするとバトルできます。</p>
      <p id="collectionStats" class="collection-stats">所持カード種類数 0/60 / 総所持枚数 0枚</p>
      <div class="toolbar">
        <button id="autoDeckBtn" class="primary">おすすめ編成</button>
        <button id="battleBtn" class="primary">バトル開始</button>
      </div>
      <div id="cardList" class="card-list"></div>
      <button class="back ghost" data-to="enemyScreen">もどる</button>
    </section>

    <section id="battleScreen" class="screen">
      <header class="scorebar">
        <div class="score-side">
          <span>自分</span>
          <strong id="playerScore">0</strong><small>/5P</small>
          <div id="playerPips" class="score-pips"></div>
        </div>
        <div class="score-side">
          <span id="enemyName">相手</span>
          <strong id="enemyScore">0</strong><small>/5P</small>
          <div id="enemyPips" class="score-pips"></div>
        </div>
      </header>
      <div id="battleLog" class="log">ダジャレ札をえらんでください。</div>
      <div id="resultBurst" class="result-burst" aria-live="polite"></div>
      <div id="gainBanner" class="gain-banner"></div>
      <div id="turnHint" class="turn-hint">ダジャレ札を選択</div>
      <div class="battle-status">
        <div id="selectedStatus" class="status-chip">
          <span>🃏 選択中</span>
          <strong id="selectedCardName">なし</strong>
        </div>
        <div id="reactionStatus" class="status-chip">
          <span>✨ ノリ</span>
          <strong id="reactionState">未使用</strong>
        </div>
      </div>
      <div id="selectedPreview" class="selected-preview">
        <span>選んだカードがここに出ます</span>
      </div>
      <div class="arena">
        <div class="field player-field">
          <p><span class="field-icon">★</span> 自分の場</p>
          <div id="playerPlay" class="played"></div>
        </div>
        <div class="field enemy-field">
          <p><span class="field-icon">♛</span> 相手の場</p>
          <div id="enemyPlay" class="played"></div>
        </div>
        <span class="vs-badge">VS</span>
      </div>
      <h3>手札</h3>
      <div id="hand" class="hand"></div>
      <button id="judgeBtn" class="primary judge" disabled>このカードで勝負</button>
    </section>

    <section id="resultScreen" class="screen">
      <div class="brand">
        <p class="kicker" id="resultSub">結果</p>
        <h2 id="resultTitle">勝利！</h2>
        <p id="resultText"></p>
      </div>
      <button id="againBtn" class="primary">もう一度あそぶ</button>
      <button id="homeBtn" class="ghost">タイトルへ</button>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
